<body>
<div id="root"></div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ================== Состояние ================== */
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
};
const S = {
  url: (window.RASP_CONFIG.url || LS.get("rasp_url") || "").replace(/\/+$/, ""),
  key: window.RASP_CONFIG.key || LS.get("rasp_key") || "",
  token: LS.get("rasp_token"),
  user: null,
  groups: [],
  users: [],
  view: "groups",       // groups | users
  groupId: LS.get("rasp_group"),
  groupTab: "schedule", // schedule | students
  sched: null,          // расписание открытой группы
  saveState: "",        // "" | saving | saved | error
  saveTimer: null,
  gate: null,           // connect | bootstrap | login
  gateError: ""
};
const DAYS = ["", "Понедельник", "Вторник", "Среда", "Четверг", "Пятница"];
const DAY_SHORT = ["", "Пн", "Вт", "Ср", "Чт", "Пт"];

/* ================== Утилиты ================== */
const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hhmm = m => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
const toMin = s => { const [h, m] = String(s).split(":").map(Number); return (h || 0) * 60 + (m || 0); };
const epochDay = d => Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
const fromEpochDay = n => { const d = new Date(n * 86400000); return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); };
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const dow = (x.getDay() + 6) % 7; x.setDate(x.getDate() - dow); return x; };
const ddmm = d => String(d.getDate()).padStart(2, "0") + "." + String(d.getMonth() + 1).padStart(2, "0");
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
/** В выходные «текущей» считаем наступающую учебную неделю — как в приложении */
const weekRef = () => { const n = new Date(); const dow = (n.getDay() + 6) % 7; return dow >= 5 ? addDays(mondayOf(n), 7) : n; };

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2600);
}

function weekTypeOf(sched, date) {
  if (!sched || !sched.refType) return 1;
  const weeks = Math.round((epochDay(mondayOf(date)) - sched.refMonday) / 7);
  const same = ((weeks % 2) + 2) % 2 === 0;
  return same ? sched.refType : (sched.refType === 1 ? 2 : 1);
}

function genPassword() {
  const abc = "abcdefghijkmnpqrstuvwxyz23456789";
  const a = new Uint32Array(8); crypto.getRandomValues(a);
  return Array.from(a, x => abc[x % abc.length]).join("");
}

const TR = { а:"a",б:"b",в:"v",г:"g",д:"d",е:"e",ё:"e",ж:"zh",з:"z",и:"i",й:"y",к:"k",л:"l",м:"m",н:"n",о:"o",п:"p",р:"r",с:"s",т:"t",у:"u",ф:"f",х:"kh",ц:"ts",ч:"ch",ш:"sh",щ:"shch",ъ:"",ы:"y",ь:"",э:"e",ю:"yu",я:"ya" };
const translit = s => String(s).toLowerCase().split("").map(c => TR[c] ?? c).join("").replace(/[^a-z0-9]/g, "");
/** «Иванов Иван Петрович» → ivanov.ip, без повторов среди занятых логинов */
function suggestLogin(fullName, taken) {
  const parts = String(fullName).trim().split(/\s+/).filter(Boolean);
  let base = translit(parts[0] || "student") || "student";
  const ini = parts.slice(1).map(p => translit(p)[0] || "").join("");
  if (ini) base += "." + ini;
  base = base.slice(0, 36);
  if (base.length < 3) base = (base + "user").slice(0, 6);
  let l = base, i = 2;
  while (taken.has(l)) l = base + i++;
  taken.add(l);
  return l;
}

/* ================== Сервер ================== */
async function rpc(fn, args = {}) {
  if (!S.url || !S.key) throw new Error("Не настроено подключение к серверу");
  let res;
  try {
    res = await fetch(S.url + "/rest/v1/rpc/" + fn, {
      method: "POST",
      headers: Object.assign({ "Content-Type": "application/json", apikey: S.key }, S.key.startsWith("eyJ") ? { Authorization: "Bearer " + S.key } : {}), // новые ключи sb_publishable_ — без Bearer
      body: JSON.stringify(args)
    });
  } catch (e) {
    throw new Error("Нет связи с сервером. Проверь интернет и адрес проекта.");
  }
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
  if (!res.ok) {
    let msg = (data && (data.message || data.hint)) || ("Ошибка сервера " + res.status);
    if (res.status === 404 && /function|Could not find/i.test(msg)) msg = "На сервере нет нужных функций. Запусти supabase_setup.sql в SQL Editor.";
    if (res.status === 401) msg = "Сервер не принял ключ. Проверь anon key.";
    if (/^AUTH: сессия/.test(msg)) { logoutLocal(); throw new Error("Сессия закончилась — войди заново"); }
    throw new Error(msg.replace(/^[A-Z_]+: /, ""));
  }
  if (data && typeof data === "object" && !Array.isArray(data) && data.error) throw new Error(String(data.error).replace(/^[A-Z_]+: /, ""));
  return data;
}
const T = () => ({ p_token: S.token });

function logoutLocal() {
  S.token = null; S.user = null; LS.set("rasp_token", null);
  S.gate = "login"; render();
}

/* ================== Старт ================== */
async function boot() {
  if (!S.url || !S.key) { S.gate = "connect"; return render(); }
  if (S.token) {
    try {
      S.user = await rpc("me", T());
      if (!(S.user.roles || []).includes("admin")) { await rpc("logout", T()).catch(() => {}); S.token = null; LS.set("rasp_token", null); S.gateError = "Этот аккаунт не администратор. Для учеников — приложение на телефоне."; throw 0; }
      S.gate = null;
      await loadAll();
      return;
    } catch (e) { if (e && e.message) S.gateError = e.message; }
  }
  try {
    S.gate = (await rpc("bootstrap_needed")) ? "bootstrap" : "login";
  } catch (e) {
    S.gate = "connect"; S.gateError = e.message;
  }
  render();
}

async function loadAll() {
  [S.groups, S.users] = await Promise.all([rpc("admin_list_groups", T()), rpc("admin_list_users", T())]);
  if (S.view === "groups") {
    if (!S.groups.find(g => g.id === S.groupId)) S.groupId = S.groups[0] ? S.groups[0].id : null;
    if (S.groupId) await openGroup(S.groupId, true);
  }
  render();
}

async function openGroup(id, silent) {
  S.view = "groups"; S.groupId = id; LS.set("rasp_group", id);
  const r = await rpc("admin_get_schedule", { ...T(), p_group: id });
  S.sched = normalizeSched(r.schedule);
  S.saveState = "";
  if (!silent) render();
}

function normalizeSched(x) {
  const s = Object.assign({ lunchEnabled: true, lunchStart: 700, lunchEnd: 740, refMonday: 0, refType: 0, slots: [], lessons: [] }, x || {});
  if (!Array.isArray(s.slots) || !s.slots.length) s.slots = [[510,600],[610,700],[740,830],[840,930],[940,1030],[1040,1130]].map((p, i) => ({ num: i + 1, start: p[0], end: p[1] }));
  s.slots.sort((a, b) => a.start - b.start);
  s.lessons = (s.lessons || []).map(l => ({ id: l.id || 0, day: +l.day, slot: +l.slot, subject: l.subject || "", kind: l.kind || "", room: l.room || "", teacher: l.teacher || "", week: +l.week || 0 }));
  if (!s.refType) { s.refMonday = epochDay(mondayOf(new Date())); s.refType = 1; }
  return s;
}

/** Автосохранение расписания через 700 мс после последней правки */
function schedChanged() {
  S.saveState = "saving"; renderStatus();
  clearTimeout(S.saveTimer);
  S.saveTimer = setTimeout(saveSched, 700);
  renderGrid();
}
async function saveSched() {
  const gid = S.groupId, sched = JSON.parse(JSON.stringify(S.sched));
  sched.lessons.forEach((l, i) => l.id = i + 1);
  try {
    await rpc("admin_set_schedule", { ...T(), p_group: gid, p_schedule: sched });
    S.saveState = "saved";
    const g = S.groups.find(g => g.id === gid); if (g) g.lessons = sched.lessons.length;
    renderSide();
  } catch (e) {
    S.saveState = "error"; S.saveError = e.message;
  }
  renderStatus();
}
window.addEventListener("beforeunload", e => { if (S.saveState === "saving" || (S.jEdits && Object.keys(S.jEdits).length)) { e.preventDefault(); e.returnValue = ""; } });

function bindGate() {
  const f = $("#f");
  const rc = $("#reconnect");
  if (rc) rc.onclick = () => { S.gate = "connect"; S.gateError = ""; render(); };
  const fg = $("#forgot");
  if (fg) fg.onclick = () => { S.gate = "reset"; S.resetEmail = null; S.resetLogin = (f.login && f.login.value) || ""; S.gateError = ""; render(); };
  const bk = $("#back");
  if (bk) bk.onclick = () => { S.gate = "login"; S.gateError = ""; S.resetEmail = null; render(); };
  const rs = $("#resend");
  if (rs) rs.onclick = async () => {
    try { const r = await rpc("login_resend", { p_ticket: S.ticket }); toast("Код отправлен на " + r.email); }
    catch (e) { S.gateError = e.message; render(); }
  };
  f.onsubmit = async ev => {
    ev.preventDefault();
    const fd = new FormData(f), btn = f.querySelector("button[type=submit]");
    btn.disabled = true; S.gateError = "";
    try {
      if (S.gate === "connect") {
        S.url = String(fd.get("url")).trim().replace(/\/+$/, ""); S.key = String(fd.get("key")).trim();
        LS.set("rasp_url", S.url); LS.set("rasp_key", S.key);
        S.gate = (await rpc("bootstrap_needed")) ? "bootstrap" : "login";
        render(); return;
      }
      if (S.gate === "reset" && !S.resetEmail) {
        S.resetLogin = String(fd.get("login")).trim();
        const x = await rpc("reset_start", { p_login: S.resetLogin });
        if (!x.ok) throw new Error(x.message);
        S.resetEmail = x.email; render(); return;
      }
      let r;
      if (S.gate === "bootstrap") r = await rpc("bootstrap_admin", { p_login: fd.get("login"), p_password: fd.get("pass"), p_full_name: fd.get("name") || "" });
      else if (S.gate === "code") r = await rpc("login_code", { p_ticket: S.ticket, p_code: fd.get("code"), p_device: "admin-panel" });
      else if (S.gate === "reset") r = await rpc("reset_finish", { p_login: S.resetLogin, p_code: fd.get("code"), p_new_password: fd.get("pass"), p_device: "admin-panel" });
      else r = await rpc("login", { p_login: fd.get("login"), p_password: fd.get("pass"), p_device: "admin-panel" });
      if (r.need_code) { S.ticket = r.ticket; S.codeEmail = r.email; S.gate = "code"; render(); return; }
      if (!(r.user.roles || []).includes("admin")) { await rpc("logout", { p_token: r.token }).catch(() => {}); throw new Error("Этот аккаунт не администратор. Для учеников — приложение на телефоне."); }
      S.token = r.token; S.user = r.user; LS.set("rasp_token", r.token);
      S.gate = null;
      await loadAll();
    } catch (e) {
      S.gateError = e.message; render();
    }
  };
}

function plural(n, a, b, c) { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? b : c); }

/* ---------- Расписание ---------- */
function scheduleShell() {
  const ref = weekRef();
  const mon = mondayOf(ref);
  const wt = weekTypeOf(S.sched, ref);
  const weekend = mondayOf(new Date()).getTime() !== mon.getTime();
  return `
    <div class="weekbar">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <span>${weekend ? "Наступающая неделя" : "Эта неделя"} (${ddmm(mon)}–${ddmm(addDays(mon, 4))}):</span>
        <div class="seg" role="group" aria-label="Тип текущей недели">
          <button class="over" aria-pressed="${wt === 1}" data-act="week" data-w="1">над чертой</button>
          <button class="under" aria-pressed="${wt === 2}" data-act="week" data-w="2">под чертой</button>
        </div>
        <span class="small muted">дальше чередуется сама</span>
      </div>
      <div class="toolbar" style="margin-left:auto">
        <button class="btn" data-act="bells">Время пар и обед</button>
        <button class="btn" data-act="print">Печать</button>
      </div>
    </div>
    <div class="grid-wrap"><table class="week" id="grid"></table></div>
    <p class="small muted" style="margin-top:10px">Нажми на клетку, чтобы поставить пару. Если предметы чередуются, клетка делится чертой: сверху — неделя над чертой, снизу — под чертой.</p>`;
}

function cellLessons(day, slot) { return S.sched.lessons.filter(l => l.day === day && l.slot === slot); }

function lesHtml(l, cls = "") {
  const meta = [l.kind, l.room ? "ауд. " + l.room : "", l.teacher].filter(Boolean).join(", ");
  return `<span class="les ${cls}"><span class="s">${esc(l.subject)}</span>${meta ? `<span class="m">${esc(meta)}</span>` : ""}</span>`;
}

function cellHtml(day, slot) {
  const ls = cellLessons(day, slot.num);
  const every = ls.find(l => l.week === 0);
  const over = ls.find(l => l.week === 1), under = ls.find(l => l.week === 2);
  const label = `${DAYS[day]}, ${slot.num} пара`;
  let inner;
  if (every) inner = lesHtml(every, "full");
  else if (over || under) inner = `
    <span class="half over">${over ? lesHtml(over) : `<span class="les"><span class="m">нет пары</span></span>`}</span>
    <span class="line" aria-hidden="true"></span>
    <span class="half under">${under ? lesHtml(under) : `<span class="les"><span class="m">нет пары</span></span>`}</span>`;
  else inner = `<span class="empty" aria-hidden="true">+</span>`;
  return `<td class="cell"><button class="cell-btn" data-cell="${day}:${slot.num}" aria-label="${esc(label)}${ls.length ? "" : ", пусто"}">${inner}</button></td>`;
}

function renderGrid() {
  const s = S.sched; if (!s) return;
  const g = S.groups.find(g => g.id === S.groupId), sub = $("#groupSub");
  if (g && sub) sub.textContent = `${g.students} ${plural(g.students, "ученик", "ученика", "учеников")} · ${s.lessons.length} ${plural(s.lessons.length, "занятие", "занятия", "занятий")} в неделе`;
  const t = $("#grid"); if (!t) return;
  const todayDow = (new Date().getDay() + 6) % 7 + 1;
  let rows = "";
  let lunchDone = !s.lunchEnabled;
  for (const sl of s.slots) {
    if (!lunchDone && sl.start >= s.lunchStart) { rows += lunchRow(); lunchDone = true; }
    rows += `<tr><th class="time" scope="row"><div class="n">${sl.num}</div><div class="t">${hhmm(sl.start)}<br>${hhmm(sl.end)}</div></th>${[1,2,3,4,5].map(d => cellHtml(d, sl)).join("")}</tr>`;
  }
  if (!lunchDone) rows += lunchRow();
  t.innerHTML = `<thead><tr><th class="time">Пара</th>${[1,2,3,4,5].map(d => `<th class="${d === todayDow ? "today" : ""}">${DAYS[d]}</th>`).join("")}</tr></thead><tbody>${rows}</tbody>`;
  function lunchRow() { return `<tr class="lunch"><th scope="row">Обед</th><td colspan="5">${hhmm(s.lunchStart)}–${hhmm(s.lunchEnd)}</td></tr>`; }
}

/* ---------- Люди ---------- */
const ROLE_NAMES = { student: "ученик", headman: "староста", teacher: "учитель", curator: "куратор", admin: "админ" };
const ROLE_ORDER = ["student", "headman", "teacher", "curator", "admin"];
const gname = id => (S.groups.find(g => g.id === id) || {}).name || "?";
function roleBadges(u) {
  return (u.roles || []).slice().sort((a, b) => ROLE_ORDER.indexOf(a) - ROLE_ORDER.indexOf(b))
    .map(r => `<span class="badge r-${r}">${ROLE_NAMES[r] || r}</span>`).join(" ");
}
/** Что у аккаунта по группам — коротко, для таблицы */
function rolesDetail(u) {
  const parts = [], R = u.roles || [];
  if (R.includes("student")) parts.push(u.group_id ? "учится: " + esc(gname(u.group_id)) : "ученик без группы");
  if (R.includes("headman") && u.headman_group) parts.push("староста " + esc(gname(u.headman_group)));
  if (R.includes("teacher")) parts.push("ведёт " + ((u.teacher_subjects || []).map(esc).join(", ") || "—") + " в " + ((u.teacher_groups || []).map(gname).map(esc).join(", ") || "—"));
  if (R.includes("curator")) parts.push("курирует " + (u.curator_groups || []).map(gname).map(esc).join(", "));
  return parts.join("; ");
}
function relatedToGroup(u, gid) {
  const R = u.roles || [];
  return (R.includes("student") && u.group_id === gid) || (R.includes("headman") && u.headman_group === gid)
      || (R.includes("teacher") && (u.teacher_groups || []).includes(gid)) || (R.includes("curator") && (u.curator_groups || []).includes(gid));
}
function usersHtml(groupId, menu) {
  const list = groupId ? S.users.filter(u => relatedToGroup(u, groupId)) : S.users;
  const g = groupId ? S.groups.find(g => g.id === groupId) : null;
  const head = groupId ? "" : `${menu}<div class="head"><div><h1>Все аккаунты</h1><p class="sub muted">${S.users.length} ${plural(S.users.length, "аккаунт", "аккаунта", "аккаунтов")}</p></div></div>`;
  const rows = list.map(u => `
    <tr>
      <td>${esc(u.full_name) || '<span class="muted">без имени</span>'}${u.disabled ? ' <span class="badge off">отключён</span>' : ""}${u.email_verified ? ` <span class="badge r-curator" title="${esc(u.email)}">почта ✓</span>` : ""}
        <div style="margin-top:3px">${roleBadges(u)}</div></td>
      <td class="login">${esc(u.login)}</td>
      <td class="small muted">${rolesDetail(u)}</td>
      <td class="small muted">${u.last_login ? "входил " + new Date(u.last_login).toLocaleDateString("ru-RU") : "ещё не входил"}</td>
      <td class="act">
        <button class="btn small" data-act="edit-user" data-id="${u.id}">Изменить</button>
        <button class="btn small" data-act="reset-pass" data-id="${u.id}">Новый пароль</button>
      </td>
    </tr>`).join("");
  return `
    ${head}
    <div class="toolbar no-print" style="margin-bottom:14px">
      <button class="btn primary" data-act="new-user" ${groupId ? `data-group="${groupId}"` : ""}>Добавить аккаунт</button>
      <button class="btn" data-act="bulk-users" ${groupId ? `data-group="${groupId}"` : ""}>Добавить учеников списком</button>
    </div>
    ${list.length ? `<div class="list"><table class="users">
      <thead><tr><th>Имя и роли</th><th>Логин</th><th>Назначения</th><th>Вход</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>`

const dlg = $("#dlg");
function openDialog(html, onBind) {
  dlg.innerHTML = `<form method="dialog" class="dlg" novalidate>${html}</form>`;
  dlg.showModal();
  const form = dlg.querySelector("form");
  form.querySelectorAll("[data-close]").forEach(b => b.onclick = e => { e.preventDefault(); dlg.close(); });
  onBind && onBind(form);
  const first = form.querySelector("input:not([type=hidden]), select, textarea");
  if (first) first.focus();
}
function dlgError(form, msg) {
  let e = form.querySelector(".err");
  if (!e) { e = document.createElement("div"); e.className = "err"; form.insertBefore(e, form.children[1]); }
  e.textContent = msg;
}
function groupOptions(sel) {
  return `<option value="">— без группы —</option>` + S.groups.map(g => `<option value="${g.id}" ${g.id === sel ? "selected" : ""}>${esc(g.name)}</option>`).join("");
}

function cellDialog(day, slotNum) {
  const sl = S.sched.slots.find(s => s.num === slotNum);
  const ls = cellLessons(day, slotNum);
  const every = ls.find(l => l.week === 0), over = ls.find(l => l.week === 1), under = ls.find(l => l.week === 2);
  let mode = every ? "every" : (over || under) ? "split" : "every";
  const subjects = [...new Set(S.sched.lessons.map(l => l.subject).filter(Boolean))].sort((a, b) => a.localeCompare(b, "ru"));
  const part = (key, l, title) => `
    <fieldset class="part ${key}">
      <legend>${title}</legend>
      <label class="field">Предмет<input type="text" name="${key}_subject" list="subjects" value="${esc(l ? l.subject : "")}" placeholder="пусто — пары нет"></label>
      <div class="row">
        <label class="field">Тип занятия<input type="text" name="${key}_kind" value="${esc(l ? l.kind : "")}" placeholder="лекция, практика, лаба"></label>
        <label class="field">Аудитория<input type="text" name="${key}_room" value="${esc(l ? l.room : "")}"></label>
      </div>
      <label class="field">Преподаватель<input type="text" name="${key}_teacher" value="${esc(l ? l.teacher : "")}"></label>
    </fieldset>`;
  openDialog(`
    <div><h2>${DAYS[day]}, ${slotNum} пара</h2><p class="muted small">${hhmm(sl.start)}–${hhmm(sl.end)}</p></div>
    <div class="seg" role="group" aria-label="Как идёт пара">
      <button type="button" class="plain" data-mode="every" aria-pressed="${mode === "every"}">Каждую неделю</button>
      <button type="button" class="plain" data-mode="split" aria-pressed="${mode === "split"}">Чередуется по чертам</button>
    </div>
    <datalist id="subjects">${subjects.map(s => `<option value="${esc(s)}">`).join("")}</datalist>
    <div data-show="every">${part("every", every || over || under, "Каждую неделю")}</div>
    <div data-show="split" style="display:grid;gap:12px">${part("over", over || every, "Над чертой")}${part("under", under, "Под чертой")}</div>
    <div class="actions">
      ${ls.length ? `<button class="btn danger left" type="button" data-clear>Очистить клетку</button>` : ""}
      <button class="btn" data-close>Отмена</button><button class="btn primary" type="submit">Сохранить</button>
    </div>`,
    form => {
      const show = () => {
        form.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === mode));
        form.querySelectorAll("[data-show]").forEach(d => d.classList.toggle("hidden", d.dataset.show !== mode));
      };
      form.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { mode = b.dataset.mode; show(); });
      show();
      const clear = () => { S.sched.lessons = S.sched.lessons.filter(l => !(l.day === day && l.slot === slotNum)); };
      const cl = form.querySelector("[data-clear]");
      if (cl) cl.onclick = () => { clear(); dlg.close(); schedChanged(); };
      form.onsubmit = e => {
        e.preventDefault();
        const read = key => ({ day, slot: slotNum, subject: form[key + "_subject"].value.trim(), kind: form[key + "_kind"].value.trim(), room: form[key + "_room"].value.trim(), teacher: form[key + "_teacher"].value.trim() });
        clear();
        if (mode === "every") { const l = read("every"); if (l.subject) S.sched.lessons.push({ ...l, week: 0 }); }
        else {
          const o = read("over"), u = read("under");
          if (o.subject) S.sched.lessons.push({ ...o, week: 1 });
          if (u.subject) S.sched.lessons.push({ ...u, week: 2 });
        }
        dlg.close(); schedChanged();
      };
    });
}

function bellsDialog() {
  const s = S.sched;
  let slots = s.slots.map(x => ({ ...x }));
  const rowsHtml = () => slots.map((x, i) => `
    <div class="slot-row">
      <span class="n">${i + 1}</span>
      <input type="time" data-i="${i}" data-k="start" value="${hhmm(x.start)}" aria-label="${i + 1} пара, начало" required>
      <input type="time" data-i="${i}" data-k="end" value="${hhmm(x.end)}" aria-label="${i + 1} пара, конец" required>
      <button type="button" class="btn ghost" data-del="${i}" aria-label="Удалить ${i + 1} пару">✕</button>
    </div>`).join("");
  openDialog(`
    <h2>Время пар и обед</h2>
    <div style="display:grid;gap:8px" id="slots"></div>
    <button type="button" class="btn" data-add style="justify-self:start">+ Добавить пару</button>
    <fieldset class="part"><legend>Обед</legend>
      <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="lunch" ${s.lunchEnabled ? "checked" : ""}> Показывать обед</label>
      <div class="row">
        <label class="field">Начало<input type="time" name="ls" value="${hhmm(s.lunchStart)}"></label>
        <label class="field">Конец<input type="time" name="le" value="${hhmm(s.lunchEnd)}"></label>
      </div>
    </fieldset>
    <p class="small muted">Если удалить пару, занятия на ней тоже удалятся.</p>
    <div class="actions"><button class="btn" data-close>Отмена</button><button class="btn primary" type="submit">Сохранить</button></div>`,
    form => {
      const box = form.querySelector("#slots");
      const draw = () => { box.innerHTML = rowsHtml(); };
      draw();
      box.oninput = e => { const i = e.target.dataset.i; if (i != null) slots[i][e.target.dataset.k] = toMin(e.target.value); };
      box.onclick = e => { const d = e.target.closest("[data-del]"); if (d) { slots.splice(+d.dataset.del, 1); draw(); } };
      form.querySelector("[data-add]").onclick = () => {
        const last = slots[slots.length - 1]; const st = last ? Math.min(last.end + 10, 1380) : 510;
        slots.push({ num: 0, start: st, end: Math.min(st + 90, 1439) }); draw();
      };
      form.onsubmit = e => {
        e.preventDefault();
        if (slots.some(x => x.end <= x.start)) return dlgError(form, "У каждой пары конец должен быть позже начала");
        const ls = toMin(form.ls.value), le = toMin(form.le.value);
        if (form.lunch.checked && le <= ls) return dlgError(form, "Конец обеда должен быть позже начала");
        // перенумеровываем пары по времени и переносим на них занятия
        const remap = new Map();
        slots.forEach(x => x._old = x.num);
        slots.sort((a, b) => a.start - b.start).forEach((x, i) => { if (x._old) remap.set(x._old, i + 1); x.num = i + 1; delete x._old; });
        s.lessons = s.lessons.filter(l => remap.has(l.slot)).map(l => ({ ...l, slot: remap.get(l.slot) }));
        s.slots = slots;
        s.lunchEnabled = form.lunch.checked; s.lunchStart = ls; s.lunchEnd = le;
        dlg.close(); schedChanged();
      };
    });
}

      : (!isNew ? `<p class="small muted">Почта не привязана — пароль восстанавливается только через «Новый пароль» здесь.</p>` : "")}

      form.querySelectorAll("input[name=role]").forEach(x => x.onchange = () => {

      });
      showParts();
      form.querySelector("[data-addsubj]").onclick = () => {
        const inp = form.querySelector("#newSubj"), v = inp.value.trim();
        if (!v) return;
        const box = form.querySelector("#subjBox");
        if (!subjects.some(x => x.toLowerCase() === v.toLowerCase())) {
          subjects.push(v);

          box.insertAdjacentHTML("beforeend", `<label><input type="checkbox" name="tsubj" value="${esc(v)}" checked>${esc(v)}</label>`);

        inp.value = "";
      };
      if (isNew) {
        let touched = false;
        form.login.oninput = () => touched = true;
        form.name.oninput = () => { if (!touched) form.login.value = form.name.value.trim() ? suggestLogin(form.name.value, new Set(taken)) : ""; };
      }
      const ce = form.querySelector("[data-clear-email]");
      if (ce) ce.onclick = async () => {
        if (!confirm(`Отвязать почту ${u.email}? Вход по коду отключится, «Забыл пароль» перестанет работать для этого аккаунта.`)) return;
        try { await rpc("admin_clear_email", { ...T(), p_id: u.id }); dlg.close(); await reloadPeople(); toast("Почта отвязана"); }
        catch (err) { dlgError(form, err.message); }
      };
      const del = form.querySelector("[data-del]");
      if (del) del.onclick = async () => {
        if (!confirm(`Удалить аккаунт ${u.login}? Войти под ним больше не получится, его отметки в журнале и долги удалятся.`)) return;
        try { await rpc("admin_delete_user", { ...T(), p_id: u.id }); dlg.close(); await reloadPeople(); toast("Аккаунт удалён"); }
        catch (err) { dlgError(form, err.message); }
      };
      form.onsubmit = async e => {
        e.preventDefault();
        if (!form.name.value.trim()) return dlgError(form, "Укажи фамилию и имя");
        const r = roles();
        if (!r.length) return dlgError(form, "Выбери хотя бы одну роль");
        const vals = n => [...form.querySelectorAll(`input[name=${n}]:checked`)].map(x => x.value);
        if (r.includes("teacher") && (!vals("tgroup").length || !vals("tsubj").length)
            && !confirm("У учителя не выбраны группы или предметы — он пока не сможет выдавать ДЗ. Сохранить так?")) return;
        const args = {
          p_full_name: form.name.value, p_roles: r,
          p_group: form.group.value || null, p_headman_group: form.hgroup.value || null,
          p_teacher_groups: vals("tgroup"), p_teacher_subjects: vals("tsubj"), p_curator_groups: vals("cgroup")
        };
        try {
          if (isNew) {
            const login = form.login.value.trim().toLowerCase(), pw = form.pass.value;
            await rpc("admin_create_user", { ...T(), p_login: login, p_password: pw, ...args });
            await reloadPeople();
            showCredentials([{ name: form.name.value.trim(), login, pass: pw }]);
          } else {
            await rpc("admin_update_user", { ...T(), p_id: u.id, ...args, p_disabled: form.disabled.checked });
            dlg.close(); await reloadPeople(); toast("Сохранено");
          }
        } catch (err) { dlgError(form, err.message); }
      };
    });
}

function bulkDialog(presetGroup) {

    form => form.onsubmit = async e => {
      e.preventDefault();
      const names = form.list.value.split("\n").map(x => x.trim().replace(/\s+/g, " ")).filter(Boolean);
      if (!names.length) return dlgError(form, "Вставь хотя бы одно имя");
      if (names.length > 200) return dlgError(form, "За раз — не больше 200 человек");
      const btn = form.querySelector("[type=submit]"); btn.disabled = true;
      const taken = new Set(S.users.map(x => x.login));

      for (const [i, n] of names.entries()) {

      }
      await reloadPeople();
      showCredentials(done, failed);
    });

function credText(list) { return list.map(c => `${c.name}\nЛогин: ${c.login}\nПароль: ${c.pass}`).join("\n\n"); }

function showCredentials(list, failed = []) {
  const text = credText(list);
  openDialog(`

    </div>`,
    form => {
      const c = form.querySelector("[data-copy]");
      if (c) c.onclick = () => navigator.clipboard.writeText(text).then(() => toast("Скопировано"), () => toast("Не удалось скопировать — выдели текст вручную"));
      const p = form.querySelector("[data-print]");
      if (p) p.onclick = () => {

      };
    });
}

const GRADES = ["", "5", "4", "3", "2", "зачёт", "незачёт"];
S.jDate = null; S.jData = null; S.jKey = ""; S.jEdits = {}; S.jMode = "day"; S.jSummary = null; S.debts = null; S.debtsClosed = false;
const isoDate = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const parseIso = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const stepWeekday = (d, dir) => { let x = addDays(d, dir); while ((x.getDay() + 6) % 7 >= 5) x = addDays(x, dir); return x; };
const DAY_GEN = ["воскресенье", "понедельник", "вторник", "среда", "четверг", "пятница", "суббота"];

/** Пары группы на дату — с учётом дня недели и чередования над/под чертой */
function lessonsOn(sched, date) {
  const dow = (date.getDay() + 6) % 7 + 1;
  if (dow > 5) return [];
  const wt = weekTypeOf(sched, date);
  const slot = n => sched.slots.find(x => x.num === n);
  return sched.lessons.filter(l => l.day === dow && (l.week === 0 || l.week === wt) && slot(l.slot))
    .sort((a, b) => slot(a.slot).start - slot(b.slot).start).map(l => ({ ...l, s: slot(l.slot) }));
}

async function loadJournalDay() {
  const key = S.groupId + "|" + isoDate(S.jDate);
  if (S.jKey === key && S.jData) return;
  S.jData = null; S.jKey = key; S.jEdits = {};
  renderJournalBody();
  try { S.jData = await rpc("journal_day", { ...T(), p_group: S.groupId, p_date: isoDate(S.jDate) }); }
  catch (e) { S.jData = { error: e.message }; }
  if (S.jKey === key) renderJournalBody();
}

function journalShell() {

        <button class="btn" data-act="jday" data-d="1" aria-label="Следующий день">›</button>
        <span class="muted">${DAY_GEN[S.jDate.getDay()]}</span>

      <div class="toolbar" style="margin-left:auto"><span id="jstatus" class="status"></span>

function renderJournalBody() {

  if (!ls.length) { el.innerHTML = `<div class="list"><div class="empty-state"><h3>Пар нет</h3><p class="muted">По расписанию группы в этот день занятий нет.</p></div></div>`; return; }
  if (!S.jData) { el.innerHTML = `<p class="muted">Загружаю журнал…</p>`; return; }
  if (S.jData.error) { el.innerHTML = `<div class="err">${esc(S.jData.error)}</div>`; return; }
  const st = S.jData.students;
  if (!st.length) { el.innerHTML = `<div class="list"><div class="empty-state"><h3>В группе нет учеников</h3><p class="muted">Добавь их во вкладке «Люди».</p></div></div>`; return; }
  const ent = {};
  for (const e of S.jData.entries) ent[e.slot + "|" + e.student_id] = e;
  const val = (slot, sid) => {
    const k = slot + "|" + sid, ed = S.jEdits[k], e = ent[k] || { absent: false, grade: "" };

  el.innerHTML = `

      <tbody>${st.map(s => `<tr><td>${esc(s.full_name)}</td>${ls.map(l => {
        const v = val(l.s.num, s.id), k = l.s.num + "|" + s.id;
        return `<td><div style="display:flex;gap:6px;align-items:center">
          <button type="button" class="nbtn" data-act="jabs" data-k="${k}" aria-pressed="${!!v.absent}" aria-label="${esc(s.full_name)}: отсутствовал">Н</button>

function markJDirty() {
  const b = $("#jsave"); if (b) b.disabled = !Object.keys(S.jEdits).length;
  const s = $("#jstatus"); if (s) { s.className = "status"; s.textContent = Object.keys(S.jEdits).length ? "Есть несохранённые изменения" : ""; }
}

async function saveJournal() {
  const ls = lessonsOn(S.sched, S.jDate), st = S.jData.students;
  const ent = {};
  for (const e of S.jData.entries) ent[e.slot + "|" + e.student_id] = e;
  const btn = $("#jsave"); btn.disabled = true;
  const status = $("#jstatus"); status.className = "status saving"; status.textContent = "Сохраняю…";
  try {
    for (const l of ls) {
      const keys = st.map(s => l.s.num + "|" + s.id);
      if (!keys.some(k => S.jEdits[k])) continue;
      const cur = k => ({ ...(ent[k] || { absent: false, grade: "" }), ...(S.jEdits[k] || {}) });
      if (keys.some(k => S.jEdits[k] && "absent" in S.jEdits[k]))
        await rpc("journal_set", { ...T(), p_group: S.groupId, p_date: isoDate(S.jDate), p_slot: l.s.num, p_subject: l.subject,
          p_entries: st.map(s => ({ student_id: s.id, absent: !!cur(l.s.num + "|" + s.id).absent })) });
      if (keys.some(k => S.jEdits[k] && "grade" in S.jEdits[k]))
        await rpc("grades_set", { ...T(), p_group: S.groupId, p_date: isoDate(S.jDate), p_slot: l.s.num, p_subject: l.subject,
          p_entries: st.map(s => ({ student_id: s.id, grade: cur(l.s.num + "|" + s.id).grade || "" })) });
    }
    S.jData = null; S.jKey = ""; S.debts = null; S.jSummary = null;
    await loadJournalDay();
    const s2 = $("#jstatus"); if (s2) { s2.className = "status saved"; s2.textContent = "Журнал сохранён"; }
  } catch (e) {
    status.className = "status error"; status.textContent = "Не сохранилось: " + e.message; btn.disabled = false;
  }
}

async function renderSummaryBody(el) {
  if (!S.jSummary || S.jSummary.group !== S.groupId) {
    el.innerHTML = `<p class="muted">Считаю сводку…</p>`;
    const to = new Date(), from = addDays(to, -150);
    try { S.jSummary = { group: S.groupId, ...(await rpc("journal_records", { ...T(), p_group: S.groupId, p_from: isoDate(from), p_to: isoDate(to) })) }; }
    catch (e) { el.innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
    if (S.jMode !== "summary" || !$("#jbody")) return;
  }
  const { students, entries } = S.jSummary;
  if (!students.length) { el.innerHTML = `<div class="list"><div class="empty-state"><h3>В группе нет учеников</h3></div></div>`; return; }
  const subjects = [...new Set(entries.map(e => e.subject).filter(Boolean))].sort((a, b) => a.localeCompare(b, "ru"));
  const by = {};
  for (const e of entries) {
    const k = e.student_id + "|" + e.subject;
    (by[k] ||= { abs: 0, grades: [] });
    if (e.absent) by[k].abs++;
    if (e.grade) by[k].grades.push(e.grade);
  }
  el.innerHTML = `
    <p class="small muted" style="margin-bottom:10px">За последние 5 месяцев. В клетке — оценки и количество Н по предмету.</p>
    <div class="list"><table class="users">
      <thead><tr><th>Ученик</th><th>Н всего</th>${subjects.map(s => `<th>${esc(s)}</th>`).join("")}</tr></thead>

        const total = entries.filter(e => e.student_id === st.id && e.absent).length;
        return `<tr><td>${esc(st.full_name)}</td><td>${total ? `<span class="badge off">${total}</span>` : '<span class="muted">0</span>'}</td>${subjects.map(sub => {

          return `<td class="small">${x ? `${esc(x.grades.join(" ")) || '<span class="muted">—</span>'}${x.abs ? ` <span class="badge off">Н ${x.abs}</span>` : ""}` : '<span class="muted">—</span>'}</td>`;
        }).join("")}</tr>`; }).join("")}</tbody>
    </table></div>`;
}

async function loadMail() {
  try { S.mail = await rpc("admin_get_mail", T()); } catch (e) { toast(e.message); return; }

}
function newToken() {
  const a = new Uint8Array(24); crypto.getRandomValues(a);
  return "rk_" + Array.from(a, b => b.toString(16).padStart(2, "0")).join("");
}
function bindMail() {
  const f = $("#mailForm"), t = $("#testForm");
  if (!f) return;
  f.querySelector("[data-gen]").onclick = () => {
    if (S.mail.token_set && !confirm("Создать новый ключ? После сохранения старый перестанет работать — новый нужно будет вставить в секрет MAIL_RELAY_TOKEN функции.")) return;
    f.token.value = newToken();
    f.querySelector("[data-copy]").classList.remove("hidden");
    $("#tokenHint").textContent = "Скопируй ключ → Supabase → Edge Functions → Secrets → MAIL_RELAY_TOKEN → вставь. Потом нажми «Сохранить» здесь.";
  };
  f.querySelector("[data-copy]").onclick = () => navigator.clipboard.writeText(f.token.value).then(() => toast("Ключ скопирован"), () => { f.token.select(); toast("Выдели и скопируй вручную"); });
  f.onsubmit = async e => {
    e.preventDefault();
    if (!S.mail.token_set && !f.token.value) return toast("Сначала создай ключ функции");
    try {
      S.mail = await rpc("admin_set_mail", { ...T(), p_function_url: f.fn.value.trim(), p_from: f.from.value, p_from_name: f.name.value, p_relay_token: f.token.value });
      renderMain(); toast("Сохранено");
    } catch (x) { toast(x.message); }
  };
  t.onsubmit = async e => {
    e.preventDefault();
    const st = $("#testStatus");
    st.className = "status saving"; st.textContent = "Отправляю…";
    try {
      const r = await rpc("admin_test_mail", { ...T(), p_to: t.to.value });
      for (let i = 0; i < 16; i++) {
        await new Promise(ok => setTimeout(ok, 1500));
        const s2 = await rpc("admin_mail_status", { ...T(), p_request: r.request_id });
        if (s2.state === "sent") { st.className = "status saved"; st.textContent = "Яндекс принял письмо — проверь почту (и папку «Спам»)"; return; }
        if (s2.state === "failed") { st.className = "status error"; st.textContent = "Не отправилось" + (s2.status ? " (" + s2.status + ")" : "") + ": " + s2.details; return; }
      }
      st.className = "status"; st.textContent = "Ответа пока нет — подожди минуту и проверь почту";
    } catch (x) { st.className = "status error"; st.textContent = x.message; }
  };
}

      rep.expired || rep.db_gone ? `удалено по сроку: ${(rep.expired || 0) + (rep.db_gone || 0)}` : "",
      rep.deleted ? `стёрто удалённых: ${rep.deleted}` : "",
    ].filter(Boolean).join(", ") || "изменений не было" : "";
  return `
    <div class="head"><div><h1>Google Диск</h1><p class="sub muted">Файлы к ДЗ хранятся на отдельном Google-аккаунте и открываются только через приложение — по тем же правам, что и задания. Через ${m.keep_days} дн. после выкладки файл удаляется сам.</p></div></div>
    ${m.pg_net ? "" : `<div class="err">В базе не включено расширение pg_net — ежедневное обслуживание (удаление старых файлов, перенос из базы) не запустится. Supabase → Database → Extensions → pg_net → Enable.</div>`}
    ${m.error ? `<div class="err">⚠️ ${esc(m.error)}</div>` : ""}
    <div class="note" style="margin-bottom:14px">${m.ready
      ? `✅ Файлы ДЗ сохраняются на Google Диск <b>${esc(m.email)}</b>.`
      : `⚠️ Google Диск не подключён — новые файлы пока сохраняются в базе (до 5 МБ). Порядок: шаг 1 → шаг 2 → шаг 3, подробности — в инструкции «НАСТРОЙКА_GOOGLE_ДИСКА».`}</div>

    <form id="driveForm" class="list" style="padding:18px;display:grid;gap:12px;max-width:680px">
      <b>Шаг 1. Функция drive-files</b>
      <label class="field">Адрес функции<input type="text" name="fn" value="${esc(fnUrl)}" placeholder="https://xxxx.supabase.co/functions/v1/drive-files"></label>
      <div class="field">Ключ функции (DRIVE_RELAY_TOKEN)
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px">
          <input type="text" name="token" readonly placeholder="${m.token_set ? "сохранён: " + esc(m.token_hint) : "ещё не создан"}" style="flex:1;min-width:220px;font-family:ui-monospace,Menlo,monospace">
          <button class="btn" type="button" data-gen>${m.token_set ? "Создать новый" : "Создать ключ"}</button>
          <button class="btn hidden" type="button" data-copy>Скопировать</button>
        </div>
        <span class="small muted" id="dTokenHint">${m.token_set ? "Ключ уже сохранён. Новый понадобится, только если старый потерян — тогда его нужно заменить и в секрете DRIVE_RELAY_TOKEN." : "Нажми «Создать ключ», скопируй и вставь в Supabase → Edge Functions → Secrets как DRIVE_RELAY_TOKEN. Потом нажми «Сохранить»."}</span>
      </div>
      <label class="field">Сколько дней хранить файлы<input type="text" inputmode="numeric" name="days" value="${m.keep_days}" style="max-width:140px"></label>
      <div><button class="btn primary" type="submit">Сохранить</button></div>
    </form>

    <div class="list" style="padding:18px;display:grid;gap:12px;max-width:680px;margin-top:14px">
      <b>Шаг 2. Адрес возврата для Google Cloud</b>
      <span class="small muted">Вставь его в Google Cloud → OAuth-клиент → «Authorized redirect URIs».</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><input type="text" id="redirUri" readonly value="${esc((m.function_url || fnUrl) + "/callback")}" style="flex:1;min-width:260px;font-family:ui-monospace,Menlo,monospace"><button class="btn" type="button" data-act="drive-copy-redir">Скопировать</button></div>
    </div>

    <div class="list" style="padding:18px;display:grid;gap:12px;max-width:680px;margin-top:14px">
      <b>Шаг 3. Подключение</b>
      ${m.connected ? `
        <span>Подключён аккаунт <b>${esc(m.email || "Google")}</b>.</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <button class="btn" type="button" data-act="drive-check">Проверить</button>
          <button class="btn" type="button" data-act="drive-connect">Подключить заново</button>
          <button class="btn danger" type="button" data-act="drive-disconnect">Отключить</button>
          <span id="driveStatus" class="status"></span>
        </div>` : `
        <span class="small muted">Откроется вход в Google. Войди в аккаунт для файлов, нажми «Разрешить» и возвращайся сюда.</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <button class="btn primary" type="button" data-act="drive-connect" ${saved ? "" : "disabled"}>Подключить Google Диск</button>
          <span id="driveStatus" class="status">${saved ? "" : "Сначала заверши шаг 1"}</span>
        </div>`}
    </div>

    <div class="list" style="padding:18px;display:grid;gap:10px;max-width:680px;margin-top:14px">
      <b>Файлы</b>
      <div class="small" style="display:grid;gap:4px">
        <span>На Google Диске: <b>${st.drive_count}</b> ${st.drive_count ? "(" + fmtMB(st.drive_bytes) + ")" : ""}</span>
        <span>В базе, ждут переноса: <b>${st.db_count}</b> ${st.db_count ? "(" + fmtMB(st.db_bytes) + ")" : ""}</span>
        <span>Удалено по сроку: <b>${st.gone_count}</b></span>
        ${st.trash_count ? `<span>Ждут удаления с Диска: <b>${st.trash_count}</b></span>` : ""}
      </div>
      <span class="small muted">${m.last_maint ? `Последнее обслуживание: ${fmtWhen(m.last_maint)} — ${esc(repLine)}${rep && rep.errors && rep.errors.length ? `. <span style="color:var(--danger)">Ошибки: ${esc(rep.errors.join("; "))}</span>` : ""}${rep && rep.unfinished ? ". Остальное — при следующем запуске" : ""}` : "Обслуживание ещё не запускалось"}. Оно запускается само раз в сутки: удаляет старые файлы и переносит файлы из базы на Диск.</span>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn" type="button" data-act="drive-maint" ${m.ready ? "" : "disabled"}>Запустить сейчас</button><span id="maintStatus" class="status"></span></div>
    </div>`;
}
async function loadDrive() {
  try { S.drive = await rpc("admin_get_drive", T()); } catch (e) { toast(e.message); return; }
  if (S.view === "drive") renderMain();
}
function bindDrive() {
  const f = $("#driveForm");
  if (!f) return;
  f.querySelector("[data-gen]").onclick = () => {
    if (S.drive.token_set && !confirm("Создать новый ключ? После сохранения старый перестанет работать — новый нужно будет вставить в секрет DRIVE_RELAY_TOKEN.")) return;
    f.token.value = newToken().replace(/^rk_/, "dk_");
    f.querySelector("[data-copy]").classList.remove("hidden");
    $("#dTokenHint").textContent = "Скопируй ключ → Supabase → Edge Functions → Secrets → DRIVE_RELAY_TOKEN → вставь. Потом нажми «Сохранить» здесь.";
  };
  f.querySelector("[data-copy]").onclick = () => navigator.clipboard.writeText(f.token.value).then(() => toast("Ключ скопирован"), () => { f.token.select(); toast("Выдели и скопируй вручную"); });
  f.onsubmit = async e => {
    e.preventDefault();
    if (!S.drive.token_set && !f.token.value) return toast("Сначала создай ключ функции");
    try {
      S.drive = await rpc("admin_set_drive", { ...T(), p_function_url: f.fn.value.trim(), p_relay_token: f.token.value, p_keep_days: +f.days.value || 90 });
      renderMain(); toast("Сохранено");
    } catch (x) { toast(x.message); }
  };
}
async function driveConnect() {
  const w = window.open("about:blank", "_blank");   // окно открываем сразу по нажатию, иначе браузер его заблокирует
  const st = $("#driveStatus");
  try {
    const r = await rpc("admin_drive_connect", T());
    if (w) w.location.href = r.url; else location.href = r.url;
  } catch (x) { if (w) w.close(); return toast(x.message); }
  const was = S.drive.connected ? S.drive.email + "|" + S.drive.error : null;
  if (st) { st.className = "status saving"; st.textContent = "Жду, пока ты нажмёшь «Разрешить» в Google…"; }
  for (let i = 0; i < 100 && S.view === "drive"; i++) {
    await new Promise(ok => setTimeout(ok, 3000));
    let m; try { m = await rpc("admin_get_drive", T()); } catch { continue; }
    if (m.connected && (was === null || m.email + "|" + m.error !== was || i > 3 && !m.error)) {
      S.drive = m; renderMain(); toast("Google Диск подключён ✓"); return;
    }
  }
}
async function driveCheck() {
  const st = $("#driveStatus");
  st.className = "status saving"; st.textContent = "Проверяю…";
  try {
    const res = await fetch(S.drive.function_url + "/check", { method: "POST", headers: { "x-session": S.token } });
    const j = await res.json().catch(() => ({ error: "функция ответила " + res.status }));
    if (!res.ok || !j.ok) throw new Error(j.error || j.msg || ("ошибка " + res.status));
    st.className = "status saved";
    st.textContent = `Всё работает: ${j.email}` + (j.limit ? `, занято ${fmtMB(j.used)} из ${Math.round(j.limit / 1073741824)} ГБ` : "") + (j.folder_recreated ? ". Папка на Диске была удалена — создана новая" : "");
    S.drive = await rpc("admin_get_drive", T());
  } catch (x) {
    st.className = "status error";
    st.textContent = /Failed to fetch|NetworkError|Load failed/.test(x.message) ? "Функция не отвечает — проверь адрес и что drive-files задеплоена (и у неё выключен Verify JWT)" : x.message;
  }
}
async function driveMaint() {
  const st = $("#maintStatus"), was = S.drive.last_maint;
  st.className = "status saving"; st.textContent = "Запускаю…";
  try { await rpc("admin_drive_maintain", T()); } catch (x) { st.className = "status error"; st.textContent = x.message; return; }
  for (let i = 0; i < 60 && S.view === "drive"; i++) {
    await new Promise(ok => setTimeout(ok, 2500));
    const m = await rpc("admin_get_drive", T()).catch(() => null);
    if (m && m.last_maint !== was) { S.drive = m; renderMain(); toast("Обслуживание закончено"); return; }
    st.textContent = "Работает…";
  }
  st.className = "status"; st.textContent = "Ещё работает — загляни сюда позже";
}

/* ================== События ================== */
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-act],[data-group],[data-tab],[data-cell]");
  if (!t || S.gate || dlg.contains(t)) return;
  const side = $("#side");
  try {
    if (t.dataset.cell) { const [d, sl] = t.dataset.cell.split(":").map(Number); return cellDialog(d, sl); }
    if (t.dataset.tab) { S.groupTab = t.dataset.tab; return renderMain(); }
    if (t.classList.contains("nav-item") && t.dataset.group) {
      side.classList.remove("open"); S.groupTab = "schedule";
      await openGroup(t.dataset.group, true); renderSide(); renderMain(); return;
    }
    const id = t.dataset.id, u = id && S.users.find(x => x.id === id);
    switch (t.dataset.act) {
      case "menu": side.classList.toggle("open"); break;
      case "users": side.classList.remove("open"); S.view = "users"; renderSide(); renderMain(); break;
      case "mail": side.classList.remove("open"); S.view = "mail"; S.mail = null; renderSide(); renderMain(); break;
      case "drive": side.classList.remove("open"); S.view = "drive"; S.drive = null; renderSide(); renderMain(); break;
      case "drive-connect": await driveConnect(); break;
      case "drive-check": await driveCheck(); break;
      case "drive-maint": await driveMaint(); break;
      case "drive-copy-redir": navigator.clipboard.writeText($("#redirUri").value).then(() => toast("Адрес скопирован"), () => { $("#redirUri").select(); toast("Выдели и скопируй вручную"); }); break;
      case "drive-disconnect":
        if (!confirm("Отключить Google Диск? Новые файлы снова будут сохраняться в базе, а уже загруженные на Диск не откроются, пока Диск не подключат снова (тем же аккаунтом).")) break;
        S.drive = await rpc("admin_drive_disconnect", T()); renderMain(); toast("Google Диск отключён"); break;
      case "my-email": myEmailDialog(); break;
      case "new-group": groupDialog(null); break;
      case "rename-group": groupDialog(S.groups.find(g => g.id === S.groupId)); break;
      case "delete-group": {
        const g = S.groups.find(g => g.id === S.groupId);
        if (!confirm(`Удалить группу «${g.name}» вместе с расписанием? Аккаунты учеников останутся, но без группы.`)) return;
        await rpc("admin_delete_group", { ...T(), p_id: g.id });
        S.groupId = null; S.sched = null; await loadAll(); toast("Группа удалена"); break;
      }
      case "week": {
        const w = +t.dataset.w; S.sched.refMonday = epochDay(mondayOf(weekRef())); S.sched.refType = w;
        $("#tabbody").querySelectorAll("[data-act=week]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.w === w));
        schedChanged(); break;
      }
      case "bells": bellsDialog(); break;
      case "print": window.print(); break;
      case "jmode": S.jMode = t.dataset.m; renderMain(); break;
      case "jday": {
        if (Object.keys(S.jEdits).length && !confirm("Изменения не сохранены. Перейти без сохранения?")) break;
        S.jDate = stepWeekday(S.jDate, +t.dataset.d); S.jData = null; renderMain(); break;
      }
      case "jabs": {
        const k = t.dataset.k, on = t.getAttribute("aria-pressed") !== "true";
        t.setAttribute("aria-pressed", on); (S.jEdits[k] ||= {}).absent = on; markJDirty(); break;
      }
      case "jsave": await saveJournal(); break;
      case "dclose": await rpc("debt_close", { ...T(), p_id: t.dataset.id, p_closed: t.dataset.c === "1" }); S.debts = null; renderDebtsBody(); toast(t.dataset.c === "1" ? "Долг закрыт" : "Долг снова открыт"); break;
      case "dremove": {
        if (!confirm("Убрать Н? Отметка в журнале снимется, долг удалится насовсем.")) break;
        await rpc("admin_remove_absence", { ...T(), p_debt: t.dataset.id }); S.debts = null; S.jData = null; S.jKey = ""; S.jSummary = null; renderDebtsBody(); toast("Н убрана");
        break;
      }
      case "new-user": userDialog(null, t.dataset.group || null); break;
      case "bulk-users": bulkDialog(t.dataset.group || null); break;
      case "edit-user": userDialog(u); break;
      case "reset-pass": resetPassDialog(u); break;
      case "my-pass": myPassDialog(); break;
      case "logout": await rpc("logout", T()).catch(() => {}); logoutLocal(); break;
    }
  } catch (err) { toast(err.message); }
});

boot();
</script>
</body>
</html>
